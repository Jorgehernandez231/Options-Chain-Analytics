name: SPX → Neon (daily)

on:
  schedule:
    - cron: "15 21 * * 1-5"   # 21:15 UTC ≈ 16:15 New York (Mon-Fri)
  workflow_dispatch: {}        # allows manual "Run workflow"

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas psycopg2-binary pytz

      - name: Run loader
        env:
          NEON_URL: ${{ secrets.NEON_URL }}
        run: |
          python spx_to_neon_final.py
